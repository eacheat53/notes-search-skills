[project]
name = "e5-base-instruct"
version = "0.1.0"
description = "Local embedding & reranking server"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "sentence-transformers>=3.3.0",
    "torch",
    "uvicorn>=0.30.0",
]

# 直接指定 CUDA 12.8 wheel URL，uv sync 时自动安装
[tool.uv.sources]
torch = { index = "pytorch" }

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
